<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Employee</title>
</head>
<body>
    
    <h1>Edit Employee</h1>
    

<form method="POST">

    <label>Name:</label>
    <input type="text" name="name" value="{{ employee[1] }}">

    <br><br>

    <label>Email:</label>
    <input type="text" name="email" value="{{ employee[2] }}">

    <br><br>

    <label>Department:</label>
    <input type="text" name="department" value="{{ employee[3] }}">

    <br><br>

    <button type="submit">
        Update Employee
    </button>

</form>
    
</body>
</html>
